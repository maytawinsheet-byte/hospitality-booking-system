<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospitality Booking System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Kanit',sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:20px;
    }

    .card{
      background:#1e293b;
      padding:40px;
      border-radius:24px;
      width:100%;
      max-width:600px;
      box-shadow:0 10px 40px rgba(0,0,0,.4);
    }

    h1{
      font-size:36px;
      margin-bottom:16px;
    }

    p{
      opacity:.8;
      line-height:1.7;
    }

    .badge{
      margin-top:24px;
      display:inline-block;
      background:#22c55e;
      color:#000;
      padding:10px 18px;
      border-radius:999px;
      font-weight:700;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Hospitality Booking System</h1>

    <p>
      ระบบจองโต๊ะ / Event / VIP / CRM<br>
      Production Version v2
    </p>

    <div class="badge">
      SYSTEM READY
    </div>
  </div>

</body>
</html>
